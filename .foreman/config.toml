mode = "soft"

[worker]
vendor = "grok"
model  = "grok-4.5"

[audit]
vendors = ["codex"]
model_codex = "gpt-5.6-sol"
# timeout_min = 30    # wall-clock audit bound; defaults from limits.round_timeout_min

[checks]
command = "bash -lc 'git init -q && git add -A && git -c user.name=Foreman -c user.email=foreman@localhost commit -qm snapshot && npm ci --ignore-scripts && npm run verify'"
docs_command = "bash skills/foreman/scripts/docs-check.sh"

[limits]
max_rework_rounds = 3
round_timeout_min = 30
# max_audit_attempts = 3  # consecutive UNVERIFIED cap; independent of rework rounds

[gate]
forbidden_paths = [
  "tests/**",
  ".github/**",
  ".foreman/**",
  "*.lock",
  "package-lock.json",
]
hash_paths = ["tests/**", ".github/**"]

[gate.groundedness]
g1 = "shadow"
g2 = "shadow"
g3 = "shadow"
g4 = "shadow"
g5 = "shadow"
g6 = "shadow"
g9a = "shadow"
g9b = "shadow"
g9c = "shadow"

[durable]
enabled = true            # enforce round-owned dispatch at the lane-run.sh boundary
checkpoint_interval = 20   # seconds
heartbeat_interval = 30
stall_warn = 300
stall_dead = 900
resume_max_attempts = 2   # v0.2.5 T8: lane-supervise.sh bounded auto-resume cap
# starting_stale = 90   # v0.2.5 T4b: watch.sh v2 typed-state thresholds (env: STARTING_STALE)
# impl_stale = 300      # (env: IMPL_STALE)
# verify_stale = 600    # (env: VERIFY_STALE)
# grace = 10            # (env: WATCH_GRACE)
# merge_base_max_commits = 50   # v0.2.5 T6: merge-gate.sh staleness bound (env: MERGE_BASE_MAX_COMMITS)
# queue_timeout = 3     # v0.2.5 T7: watch.sh wd_is_queued pueue-status-probe bound (env: WATCH_QUEUE_TIMEOUT)

[nats]
url = "nats://127.0.0.1:4222"
store_dir = "~/.foreman/nats-store"
stream = "FOREMAN"
subject_prefix = "foreman"

# Verdict-to-action policy. Values shown are the built-in defaults.
# [audit.policy]
# warning_low_resolved = "merge"   # (env: AUDIT_POLICY_WARNING_LOW_RESOLVED)
# warning_medium = "ask"           # (env: AUDIT_POLICY_WARNING_MEDIUM)
# blocked = "never"                # (env: AUDIT_POLICY_BLOCKED)
# unverified = "retry"              # (env: AUDIT_POLICY_UNVERIFIED)
