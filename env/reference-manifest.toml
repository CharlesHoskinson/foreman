# Foreman reference development environment — inventory source of truth.
# tool-check.{ps1,sh} and bootstrap-*.{ps1,sh} read this (or embed a mirror).
# Profiles: soft | hard | full | durable

schema_version = 1
name = "foreman-reference"
description = "Windows host + WSL2 Ubuntu reference env for Foreman soft and hard modes"
# v0.2.7.5 package 3 (wsl-reliability-env-refresh) Task 5: every entry below
# re-probed for real on both Windows and WSL and reconciled to match --
# shellcheck was PREVIOUSLY claimed installed on Windows (2026-07-17 note)
# but was not actually present (a live bug this task fixed for real, both
# sides); WSL bats/bun/pueue/codex/grok were previously either apt-missing,
# entirely un-installed, or leaking the Windows binary via appendWindowsPath.
probe_verified_date = "2026-07-18"

[platform]
# Hard mode scripts are bash; soft mode can run on Windows host CLIs.
primary_hard = "wsl2-ubuntu"
primary_soft = "windows-or-wsl"
ubuntu_codename = "noble-or-later"  # 24.04+; 26.04 preferred when available
wsl_distro_hint = "Ubuntu-26.04"

# --- Soft mode (architect + lanes) ---
[[tools]]
id = "git"
profile = ["soft", "hard", "full"]
where = ["windows", "wsl"]
check = "git --version"
install_wsl = "sudo apt-get install -y git"
install_windows = "winget install --id Git.Git -e --accept-package-agreements --accept-source-agreements"
required = true

[[tools]]
id = "python3"
profile = ["soft", "hard", "full"]
where = ["windows", "wsl"]
check = "python3 --version || python --version"
min_version = "3.11"
install_wsl = "sudo apt-get install -y python3 python3-pip python3-venv"
install_windows = "winget install --id Python.Python.3.12 -e --accept-package-agreements --accept-source-agreements"
required = true
notes = "HELD 2026-07-18 (v0.2.7.5 pkg-3 dependency table -- current stable both sides; WSL Python 3.14.4 probe-verified, well above the 3.11 floor)."

[[tools]]
id = "jq"
profile = ["soft", "hard", "full", "durable"]
where = ["wsl"]
check = "jq --version"
install_wsl = "sudo apt-get install -y jq"
required = true
notes = "Hard-mode scripts (meta.json, gate) need jq. Widened to every profile on 2026-08-01: foreman-fit-report.sh reads the fit ledger and is invoked from foreman-cleanup.sh, which closes runs in soft mode too. It REQUIRES jq and refuses without it rather than falling back -- a jq-optional regex path was tried and a cross-vendor audit proved it silently miscounts VALID nested JSON, parsing a record whose nested object carries a decoy phase as implement/1 under jq and discover/5 under the regex. A regex cannot parse JSON structure, and for a metric a wrong number is worse than a refusal. HELD 2026-07-18 for the version pin (jq-1.8.1 WSL / jq-1.8.2 Windows probe-verified)."

[[tools]]
id = "grok"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "grok --version"
install_wsl = "npm install -g @xai-official/grok@latest"
install_windows = "npm install -g @xai-official/grok@latest"
install_hint = "npm mirror avoids the Cloudflare-walled x.ai/cli host (verified route: openspec/changes/grok-lane-activation/design.md). After install: grok login --device-code (headless/remote-safe; XAI_API_KEY also accepted)"
required = true
notes = "Default implementer lane. Probe-verified 2026-07-18: `npm install -g @xai-official/grok` is genuinely WSL-native-installable (env/bootstrap-wsl.sh does this now) -- previously this script only printed a manual-vendor-install hint and never actually installed it on WSL."

[[tools]]
id = "codex"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "codex --version"
install_wsl = "npm install -g @openai/codex@latest"
install_windows = "npm install -g @openai/codex@latest"
install_hint = "After install: codex login (needs GPT-5.6 Sol access for audit)"
required = true
notes = "Default auditor (GPT-5.6 Sol) + optional implementer. LIVE BUG fixed 2026-07-18 (v0.2.7.5 pkg-3): on WSL, `codex` was resolving the Windows npm-global shim leaked in via appendWindowsPath (its @openai/codex-linux-x64 optionalDependency is win32-gated and can never satisfy a WSL node runtime -- crashed with \"Missing optional dependency\"). Fix is two-layered: (1) install codex WSL-native forcing `@latest` (a bare `npm install -g @openai/codex` on an already-present top-level package can skip re-resolving the per-platform optionalDependency -- reproduced during this task's proof); (2) appendWindowsPath=false in /etc/wsl.conf so the leaked shim is unreachable at all. See reference-environment.md's \"WSL interop\" section."

[[tools]]
id = "claude"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "claude --version"
install_hint = "Install Claude Code (https://code.claude.com) and authenticate"
required = false
notes = "Typical architect host; not required if orchestrating from Grok/Codex"

[[tools]]
id = "node"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "node --version"
install_wsl = "curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir ~/.foreman/tools/fnm --skip-shell && ~/.foreman/tools/fnm/fnm install --lts"
install_windows = "winget install --id OpenJS.NodeJS.LTS -e --accept-package-agreements --accept-source-agreements"
required = false
notes = "Needed to install codex/grok via npm if not already present. Reprovisioned via fnm 2026-07-18 (v0.2.7.5 pkg-3): apt's own nodejs+npm pairing had drifted (node 22 + npm 9.2.0 -- npm shipped with node 22 is normally 10.x+), which is suspected to be why an earlier WSL codex install never pulled its platform optionalDependency correctly. fnm-managed LTS (v24.18.0 / npm 11.16.0 at probe time) is a coherent, current pair; env/bootstrap-wsl.sh symlinks its node/npm/npx into /usr/local/bin so they resolve ahead of the apt package without needing any shell profile sourced."

[[tools]]
id = "npm"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "npm --version"
required = false

# --- Hard mode (WSL bash harness) ---
[[tools]]
id = "docker"
profile = ["hard", "full"]
where = ["wsl"]
check = "docker version"
install_wsl = "# see bootstrap-wsl.sh docker section (docker-ce + systemd)"
required = true
notes = "Native docker-ce in WSL preferred over Docker Desktop for hard workers. Upgraded (minor) 2026-07-18 (v0.2.7.5 pkg-3, dependency table): 29.5.3 -> 29.6.2 via `apt-get install docker-ce docker-ce-cli containerd.io` (already-tracked download.docker.com apt repo; no new repo needed). Deliberately a one-time dependency-table action, not an every-bootstrap-run auto-upgrade -- env/bootstrap-wsl.sh's own docker section stays install-if-missing (conservative; an already-running daemon/containers are not something a provisioning script should silently upgrade out from under)."

[[tools]]
id = "shellcheck"
profile = ["hard", "full"]
where = ["windows", "wsl"]
check = "shellcheck --version"
install_wsl = "sudo apt-get install -y shellcheck"
install_windows = "winget install --id koalaman.shellcheck -e --accept-package-agreements --accept-source-agreements --scope user"
required = false
notes = "Bash static analysis. LIVE BUG fixed 2026-07-18 (v0.2.7.5 pkg-3): the 2026-07-17 note here claimed shellcheck was already installed on Windows via winget -- it was NOT (`winget list --id koalaman.shellcheck` found no installed package; `shellcheck` was not on PATH in any shell session probed). Actually installed for real on both sides 2026-07-18: WSL apt (0.11.0-2) and Windows winget (per the install_windows command above). Running shellcheck for real against this repo's own bash for the first time caught a genuine latent bug: env/bootstrap-wsl.sh had a `# shellcheck / bats for hard/full` comment that collided with shellcheck's own inline-directive syntax (SC1072/SC1073) -- fixed."

[[tools]]
id = "bats"
profile = ["full"]
where = ["wsl"]
check = "bats --version || ~/.foreman/tools/bats-core/bin/bats --version"
install_wsl = "sudo apt-get install -y bats  # git clone --depth 1 https://github.com/bats-core/bats-core ~/.foreman/tools/bats-core as a portability fallback for distros without an apt bats package"
required = true
notes = "Test harness for skills/foreman/scripts (tests/run.sh). Probe-verified 2026-07-18: Ubuntu 26.04 ships bats 1.13.0-1 directly via apt (env/bootstrap-wsl.sh tries this first now); the git-clone route stays as a fallback for older distros without an apt package."

[[tools]]
id = "sqlite3"
profile = ["full"]
where = ["wsl"]
check = "sqlite3 --version"
install_wsl = "sudo apt-get install -y sqlite3"
required = true
notes = "NOT used by product code -- python3's stdlib sqlite3 module is what reads .foreman/session.db, and that is unaffected by this entry. Required because tests/session.bats shells out to the sqlite3 CLI directly in three tests (import-sidecar row/column fidelity dump, and two freshness tests that seed rows via `sqlite3 ... UPDATE`), not because the runtime needs it. Probe-verified 2026-08-07 on WSL, before and after this fix, same host: without the CLI, tests/session.bats scores pass=31 fail=3 of 34 (three status-127 failures); with it, pass=34 fail=0. Before this entry existed, `env/bootstrap-wsl.sh --profile full --yes` completed exit 0 WITHOUT installing sqlite3 -- the prior 'not required' manifest claim was not just inaccurate prose, it left a freshly bootstrapped full-profile host missing a tool its own test suite needs. The same three failures reproduce on the Windows CI runner (docs/evidence/w0/2026-08-07-windows-suite-measurement.md). tests/baseline.tsv wsl floor intentionally stays at 31 pending a follow-up that re-verifies a clean bootstrap now installs sqlite3 before raising it to 34."

[[tools]]
id = "flock"
profile = ["hard", "full", "durable"]
where = ["wsl"]
check = "command -v flock"
install_wsl = "sudo apt-get install -y util-linux"
required = true
notes = "Primary durable lock mechanism (lock-primitive-hardening). Required for hard/full/durable on WSL/Linux. NOT available on MSYS2/Git-Bash (no pacman util-linux flock); that host uses the mkdir fallback only when the resolved mkdir.exe digest is in the pinned atomicity register below. Advisory locking on network/DrvFs mounts is filesystem-class scoped — see lock_atomicity probe rows."

[[tools]]
id = "strace"
profile = ["soft", "hard", "full", "durable"]
where = ["wsl"]
check = "command -v strace"
install_wsl = "sudo apt-get install -y strace"
required = true
notes = "Load-bearing, not diagnostic: the syscall evidence class is the ONLY one that can license a lock mechanism as `atomic` (flavour licenses nothing; contention can license only `non-atomic` or `unknown`). On Ubuntu 26.04, where mkdir resolves to uutils and is permanently distrusted (docs/research/vnext/F-uutils-mkdir-blocker.md), a host without strace has no trusted mechanism at all and lib/lock.sh fail-closes with FM_LOCK_UNAVAILABLE. Probe-verified 2026-08-01: absent on a fresh WSL host, which failed 102 bats tests across 11 files until it was installed; with it, flock probes atomic (syscall) and the suite is 604/0. Reported by tool-check on every POSIX profile so the absence is visible up front."

[[tools]]
id = "bash"
profile = ["soft", "hard", "full", "durable"]
where = ["windows", "wsl"]
check = "bash --version"
install_wsl = "sudo apt-get install -y bash"
required = true
notes = "Every Foreman script is bash and uses arrays, `local`, and `[[ ]]`; it is not POSIX-sh portable. Declared explicitly because tool-check gates on it for the durable profile and the manifest previously omitted it. Probe-verified 2026-08-01: GNU bash 5.3.9 on WSL Ubuntu 26.04."

# --- Gate parallelism (v0.2.5 --jobs enabler; see docs/research gate-speedup) ---
[[tools]]
id = "parallel"
profile = ["full"]
where = ["windows", "wsl"]
check = "parallel --version"
install_wsl = "sudo apt-get install -y parallel"
install_windows = "# GNU parallel is pure perl; drop src/parallel from ftp.gnu.org/gnu/parallel into ~/bin (perl already present on Git-Bash). Host proxy strips gnu.org binary bodies — fetch via GitHub mirror or scrapling."
required = false
notes = "GNU parallel enables 'bats --jobs' suite-level parallelism (~3-4x after WATCH_VTICK removes wall-clock flake). DEFER-v0.2.5. Test suite verified isolation-clean (perf report E)."

[[tools]]
id = "gh"
profile = ["hard", "full"]
where = ["windows", "wsl"]
check = "gh --version"
install_wsl = "official cli.github.com apt repo (see env/bootstrap-wsl.sh's gh section) then: sudo apt-get install -y gh"
install_windows = "winget install --id GitHub.cli -e --accept-package-agreements --accept-source-agreements"
required = false
notes = "PR open stage. Upgraded (security) 2026-07-18 (v0.2.7.5 pkg-3, dependency table): Ubuntu 26.04's own `gh` universe package was stuck at 2.46.0-4 with no newer apt candidate at all (does not track upstream releases), while upstream was already at 2.96.0. env/bootstrap-wsl.sh now adds the official cli.github.com apt repo (keyring + sources.list.d entry) so gh installs/upgrades to a genuinely current version and stays current on future `apt-get upgrade`. Windows side (winget) was already current (2.92.0) at probe time -- no action needed there."

[[tools]]
id = "timeout"
profile = ["soft", "hard", "full"]
where = ["wsl"]
check = "command -v timeout || command -v gtimeout"
install_wsl = "sudo apt-get install -y coreutils"
required = false

# --- Foreman skill install ---
[[tools]]
id = "foreman_skill"
profile = ["soft", "hard", "full"]
where = ["windows", "wsl"]
check = "test -f \"$HOME/.claude/skills/foreman/SKILL.md\" || test -f \"$HOME/.agents/skills/foreman/SKILL.md\""
install_windows = "powershell -ExecutionPolicy Bypass -File install.ps1"
install_wsl = "bash install.sh"
required = true

[[tools]]
id = "markdownlint-cli2"
profile = ["full"]
where = ["windows", "wsl"]
check = "markdownlint-cli2 --version"
install_wsl = "npm install -g markdownlint-cli2"
install_windows = "npm install -g markdownlint-cli2"
required = true
notes = "docs group -- markdown lint. HELD 2026-07-18 (v0.2.7.5 pkg-3 dependency table -- current stable, v0.23.1). On WSL this was previously resolving the Windows npm shim leaked in via appendWindowsPath (same class of bug as codex) rather than actually installing WSL-native -- env/bootstrap-wsl.sh's install guard now checks the resolved path is not under /mnt/ before treating it as already-present, and symlinks the WSL-native install into /usr/local/bin."

[[tools]]
id = "codespell"
profile = ["full"]
where = ["windows", "wsl"]
check = "codespell --version || python3 -m codespell_lib --version || python -m codespell_lib --version"
install_wsl = "sudo apt-get install -y codespell"
install_windows = "pip install --user codespell"
required = true
notes = "docs group -- spelling. HELD 2026-07-18 (v0.2.7.5 pkg-3 dependency table -- current stable, 2.4.1). install_wsl changed from `pip3 install --user` to apt 2026-07-18: this WSL's Python 3.14 refuses PEP 668 unmanaged pip installs (\"externally-managed-environment\", reproduced during this task's proof) without --break-system-packages; Debian ships a `codespell` apt package directly, which is both simpler and avoids that refusal entirely."

[[tools]]
id = "lychee"
profile = ["full"]
where = ["windows", "wsl"]
check = "lychee --version"
install_windows = "winget install --id lycheeverse.lychee -e --accept-package-agreements --accept-source-agreements"
install_wsl = "curl -fsSL -o /tmp/lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz && tar -xzf /tmp/lychee.tar.gz -C ~/.foreman/tools/lychee --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee"
required = true
notes = "docs group -- link check (offline by default). HELD at 0.24.2 both sides 2026-07-18 (v0.2.7.5 pkg-3 dependency table -- current stable). install_wsl changed from `cargo install`/`cargo binstall` to a GitHub release binary 2026-07-18: this WSL has no cargo/Rust toolchain, and requiring a full Rust install just for one CLI tool is unnecessary when the upstream project already publishes a prebuilt musl static binary (same approach as pueue, and as Windows's own winget route, which is also a prebuilt binary, not a from-source build)."

[[tools]]
id = "psscriptanalyzer"
profile = ["soft", "full"]
where = ["windows"]
check = 'powershell -NoProfile -Command "if (Get-Module -ListAvailable PSScriptAnalyzer) { exit 0 } else { exit 1 }"'
install_windows = 'powershell -NoProfile -Command "Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force"'
required = false
notes = "docs group -- PowerShell lint"

[[tools]]
id = "graphify"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "graphify --version"
install_hint = "pip install graphifyy  (module name: graphify)"
required = false
notes = "Knowledge-graph repo understanding. graphify-out/ is a derived local index, not a committed graph."

[[tools]]
id = "openspec"
profile = ["full"]
where = ["windows", "wsl"]
check = "openspec --version"
install_wsl = "npm install -g @fission-ai/openspec"
install_windows = "npm install -g @fission-ai/openspec"
required = false
notes = "Optional CLI; foreman follows OpenSpec folder conventions without it"

[[tools]]
id = "bun"
profile = ["full"]
where = ["windows", "wsl"]
check = "bun --version"
install_windows = "winget install --id Oven-sh.Bun --version 1.3.14 -e"
install_wsl = "curl -fsSL https://bun.sh/install | bash -s \"bun-v1.3.14\""
required = false
notes = "HELD at 1.3.14 both sides (v0.2.7.5 pkg-3 dependency table -- 1.4 is canary-only, the 2-patch soak rule is unmet; do NOT upgrade). winget does not self-pin (a later 'winget upgrade' can silently drift the installed version); tool-check WARNs (reports outdated, does not fail) when the installed bun is not exactly 1.3.14. Probe-verified 2026-07-18: WSL had no bun at all before this task (env/bootstrap-wsl.sh now installs it, pinned, via bun's own official install script); Windows had 1.3.14 genuinely installed via winget already, though a stale shell-session PATH snapshot can make it look absent until a fresh shell picks up the winget PATH update -- not a real gap, a session artifact (same class as the shellcheck-install PATH-refresh note above)."

[[tools]]
id = "foreman-launch"
profile = ["soft", "hard", "full", "durable"]
where = ["wsl"]
check = "test -x launcher/dist/foreman-launch"
install_wsl = "cd launcher && bun run build:posix"
required = false
notes = "Setup builds this POSIX launcher automatically when bun is present. tool-check promotes an absent launcher to NOT-READY on WSL hard/full only when bun can build it; if should-tier bun is also absent, the launcher row is DEGRADED instead of permanently blocking readiness."

[[tools]]
id = "pueue"
profile = ["full"]
where = ["windows", "wsl"]
check = "pueue --version"
install_windows = "# GitHub release binaries -- no package-manager route. Download pueue.exe + pueued.exe from https://github.com/Nukesor/pueue/releases into ~/.foreman/tools/pueue"
install_wsl = "curl -fsSL -o ~/.foreman/tools/pueue/pueue https://github.com/Nukesor/pueue/releases/download/v4.0.4/pueue-x86_64-unknown-linux-musl && curl -fsSL -o ~/.foreman/tools/pueue/pueued https://github.com/Nukesor/pueue/releases/download/v4.0.4/pueued-x86_64-unknown-linux-musl && chmod +x ~/.foreman/tools/pueue/{pueue,pueued}"
required = false
notes = "v4.0.4 HELD both sides (v0.2.7.5 pkg-3 dependency table -- current stable). Windows: staged at ~/.foreman/tools/pueue/{pueue.exe,pueued.exe}. WSL (new 2026-07-18, was entirely absent before this task): staged at ~/.foreman/tools/pueue/{pueue,pueued} (no .exe -- native ELF binaries), also symlinked into /usr/local/bin by env/bootstrap-wsl.sh. No package-manager install route on either side (GitHub release binaries only). Autostart doctrine: the pueue CLIENT never starts pueued itself (empirically confirmed -- `pueue status` with no daemon fails immediately rather than autostarting it); skills/foreman/scripts/lane-queue.sh's `ensure` subcommand spawns `pueued -d` itself when the daemon is unreachable -- see that script's header for the full empirical record."

[[tools]]
id = "coreutils"
profile = ["durable"]
where = ["windows", "wsl"]
check = "stdbuf --version || gstdbuf --version"
install_wsl = "sudo apt-get install -y coreutils"
install_windows = "scoop install main/coreutils"
required = true
notes = "stdbuf -oL line-buffers the reasoning stream tee"

[[tools]]
id = "nats-server"
profile = ["durable"]
where = ["windows", "wsl"]
check = "nats-server --version"
install_wsl = "curl -fsSL https://binaries.nats.dev/nats-io/nats-server/v2@latest | sh"
install_windows = "scoop install main/nats-server"
required = false
notes = "JetStream transport; required only when [durable] enabled with NATS"

[[tools]]
id = "nats-cli"
profile = ["durable"]
where = ["windows", "wsl"]
check = "nats --version"
install_wsl = "curl -sf https://binaries.nats.dev/nats-io/natscli/nats@latest | sh"
install_windows = "scoop install extras/natscli"
required = false
notes = "Drives JetStream from bash (setup, bridge, consume)"

[profiles.soft]
description = "Claude/Grok/Codex soft orchestration on host"
must = ["git", "python3", "grok", "codex", "foreman_skill"]
should = ["claude", "node", "npm", "jq"]

[profiles.hard]
description = "WSL2 bash harness + Docker workers"
must = ["git", "python3", "jq", "docker", "flock", "foreman_skill"]
should = ["shellcheck", "bats", "gh", "timeout", "grok", "codex"]

[profiles.full]
description = "Soft lanes + hard harness on Windows+WSL reference box"
must = ["git", "python3", "jq", "grok", "codex", "docker", "flock", "foreman_skill"]
should = ["claude", "node", "npm", "shellcheck", "bats", "gh", "timeout", "bun", "pueue"]

[profiles.durable]
must = ["git", "jq", "coreutils", "bash", "flock"]
should = ["nats-server", "nats-cli"]

[[skills]]
id = "foreman"
path = "skills/foreman"

[[skills]]
id = "scrapling"
path = "skills/scrapling"

[[skills]]
id = "graphify"
path = "skills/graphify"

[[skills]]
id = "superpowers"
path = "skills/superpowers"


# =============================================================================
# Lock atomicity (lock-primitive-hardening, round L2 / T5)
# =============================================================================
# Evidence classes that may license atomic|non-atomic: syscall, pinned-mechanism.
# contention may license non-atomic only. flavour licenses nothing on its own.
# Entries in the pinned register come ONLY from a syscall trace taken on a
# Foreman-controlled host — never from a version string or a vendor claim.
# A version-string match is not a digest match.

[lock_atomicity.coreutils_hazard]
date = "2026-07-28"
host = "Ubuntu 26.04 (WSL2 reference box)"
summary = """
Ubuntu 26.04 ships a hybrid coreutils: mkdir, stat, date, sort and ln resolve
to uutils (Rust) 0.8.0 while mv and rm remain GNU 9.7. Measured 2026-07-28 with
8 racers on one lock: uutils 57 mutual-exclusion violations / 15 rounds; GNU 0;
flock 0 on ext4, tmpfs and drvfs. uutils performs a userspace statx check-then-
act (TOCTOU); GNU issues mkdir(2) and takes EEXIST from the kernel. See
docs/research/vnext/F-uutils-mkdir-blocker.md and tests/probes/mkdir-atomicity.sh.
"""
uutils_utilities = ["mkdir", "stat", "date", "sort", "ln"]
uutils_version = "0.8.0"
gnu_utilities = ["mv", "rm"]
gnu_version = "9.7"
measured_violations_uutils_15x8 = 57
measured_violations_gnu_15x8 = 0
measured_violations_flock_ext4 = 0
measured_violations_flock_tmpfs = 0
measured_violations_flock_drvfs = 0

# Pinned atomicity register.
# Each entry: mechanism, sha256 of the primitive binary, host_class the syscall
# trace was taken on, path to the committed trace artifact (repo-relative),
# filesystem_classes the verdict covers, date, and optional notes.
# For mechanism = "mkdir", probe_target is REQUIRED: the path fragment the
# probe contended on. Validators bind EEXIST / ERROR_ALREADY_EXISTS to that
# fragment; an unbound EEXIST anywhere in the trace licenses nothing.
# Seed policy (BRIEF T5): seed at least one MSYS2/Git-Bash mkdir.exe so the
# fallback's only host has a reachable trusted path. IF a real Git-Bash trace
# cannot be obtained in the implementing environment, leave the register with
# ZERO seeded entries rather than fabricating one. A fabricated entry is worse
# than an unreachable fallback.
#
# [[lock_atomicity.pinned]]
# mechanism = "mkdir"
# sha256 = "<hex>"
# host_class = "msys2-git-bash"
# trace_artifact = "docs/research/lock-traces/msys2-mkdir-<digest-prefix>.trace"
# probe_target = "x"   # REQUIRED for mkdir: fragment of the contended path
# filesystem_classes = ["local"]
# date = "YYYY-MM-DD"
# verdict = "atomic"
# notes = "strace/NT-equivalent observed mkdir create + ERROR_ALREADY_EXISTS"

# Intentionally empty on day of L2 implementation in the WSL-only worktree:
# no Foreman-controlled MSYS2/Git-Bash host was available to capture a real
# syscall trace. Do not invent a digest. Git-Bash durable locks remain
# unreachable until a real pin is committed from a traced host.

# =============================================================================
# Vendor preflight capabilities (Sprint 3 R4A / vendor-preflight)
# =============================================================================
# Authored capability table for the typed vendor-preflight runtime. The
# compiled runtime embeds a canonical JSON digest of this table at build time
