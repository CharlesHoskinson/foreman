# Foreman reference development environment — inventory source of truth.
# tool-check.{ps1,sh} and bootstrap-*.{ps1,sh} read this (or embed a mirror).
# Profiles: soft | hard | full | durable

schema_version = 1
name = "foreman-reference"
description = "Windows host + WSL2 Ubuntu reference env for Foreman soft and hard modes"

[platform]
# Hard mode scripts are bash; soft mode can run on Windows host CLIs.
primary_hard = "wsl2-ubuntu"
primary_soft = "windows-or-wsl"
ubuntu_codename = "noble-or-later"  # 24.04+; 26.04 preferred when available
wsl_distro_hint = "Ubuntu-26.04"

# --- Soft mode (architect + lanes) ---
[[tools]]
id = "git"
profile = ["soft", "hard", "full"]
where = ["windows", "wsl"]
check = "git --version"
install_wsl = "sudo apt-get install -y git"
install_windows = "winget install --id Git.Git -e --accept-package-agreements --accept-source-agreements"
required = true

[[tools]]
id = "python3"
profile = ["soft", "hard", "full"]
where = ["windows", "wsl"]
check = "python3 --version || python --version"
min_version = "3.11"
install_wsl = "sudo apt-get install -y python3 python3-pip python3-venv"
install_windows = "winget install --id Python.Python.3.12 -e --accept-package-agreements --accept-source-agreements"
required = true

[[tools]]
id = "jq"
profile = ["hard", "full"]
where = ["wsl"]
check = "jq --version"
install_wsl = "sudo apt-get install -y jq"
required = true
notes = "Hard-mode scripts (meta.json, gate) need jq"

[[tools]]
id = "grok"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "grok --version"
install_wsl = "npm i -g @xai-official/grok"
install_windows = "npm i -g @xai-official/grok"
install_hint = "Binary resolves from the npm global prefix (avoids the Cloudflare-walled x.ai installer host). After install: grok login --device-code (headless/remote-safe; XAI_API_KEY also accepted)"
required = true
notes = "Default implementer lane; auth verified in the Setup stage, never mid-lane"

[[tools]]
id = "codex"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "codex --version"
install_wsl = "npm install -g @openai/codex"
install_windows = "npm install -g @openai/codex"
install_hint = "After install: codex login (needs GPT-5.6 Sol access for audit)"
required = true
notes = "Default auditor (GPT-5.6 Sol) + optional implementer"

[[tools]]
id = "claude"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "claude --version"
install_hint = "Install Claude Code (https://code.claude.com) and authenticate"
required = false
notes = "Typical architect host; not required if orchestrating from Grok/Codex"

[[tools]]
id = "node"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "node --version"
install_wsl = "curl -fsSL https://fnm.vercel.app/install | bash && fnm install --lts"
install_windows = "winget install --id OpenJS.NodeJS.LTS -e --accept-package-agreements --accept-source-agreements"
required = false
notes = "Needed to install codex via npm if not already present"

[[tools]]
id = "npm"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "npm --version"
required = false

# --- Hard mode (WSL bash harness) ---
[[tools]]
id = "docker"
profile = ["hard", "full"]
where = ["wsl"]
check = "docker version"
install_wsl = "# see bootstrap-wsl.sh docker section (docker-ce + systemd)"
required = true
notes = "Native docker-ce in WSL preferred over Docker Desktop for hard workers"

[[tools]]
id = "shellcheck"
profile = ["hard", "full"]
where = ["windows", "wsl"]
check = "shellcheck --version"
install_wsl = "sudo apt-get install -y shellcheck"
install_windows = "winget install --id koalaman.shellcheck -e --accept-package-agreements --accept-source-agreements --scope user"
required = false
notes = "Bash static analysis. Installed on Windows host 2026-07-17 via winget."

[[tools]]
id = "bats"
profile = ["full"]
where = ["wsl"]
check = "bats --version || ~/.foreman/tools/bats-core/bin/bats --version"
install_wsl = "git clone --depth 1 https://github.com/bats-core/bats-core ~/.foreman/tools/bats-core"
required = true
notes = "Test harness for skills/foreman/scripts (tests/run.sh)"

[[tools]]
id = "flock"
profile = ["hard", "full"]
where = ["wsl"]
check = "command -v flock"
install_wsl = "sudo apt-get install -y util-linux"
required = true
notes = "Serialized worktree ops. NOT required on the Windows/Git-Bash host: lane locking falls back to mkdir-based atomic locks (see eventlog.sh/wt-new.sh). util-linux flock is unavailable on Git-Bash (no pacman); WSL-side only."

# --- Gate parallelism (v0.2.5 --jobs enabler; see docs/research gate-speedup) ---
[[tools]]
id = "parallel"
profile = ["full"]
where = ["windows", "wsl"]
check = "parallel --version"
install_wsl = "sudo apt-get install -y parallel"
install_windows = "# GNU parallel is pure perl; drop src/parallel from ftp.gnu.org/gnu/parallel into ~/bin (perl already present on Git-Bash). Host proxy strips gnu.org binary bodies — fetch via GitHub mirror or scrapling."
required = false
notes = "GNU parallel enables 'bats --jobs' suite-level parallelism (~3-4x after WATCH_VTICK removes wall-clock flake). DEFER-v0.2.5. Test suite verified isolation-clean (perf report E)."

[[tools]]
id = "psscriptanalyzer"
profile = ["full"]
where = ["windows"]
check = "pwsh -NoProfile -Command \"Get-Module PSScriptAnalyzer -ListAvailable\""
install_windows = "pwsh -NoProfile -Command \"Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AcceptLicense\""
required = false
notes = "PowerShell static analysis for install.ps1 / env scripts. Installed 2026-07-17 (v1.25.0), CurrentUser scope (no admin)."

[[tools]]
id = "gh"
profile = ["hard", "full"]
where = ["windows", "wsl"]
check = "gh --version"
install_wsl = "sudo apt-get install -y gh || (type -p curl >/dev/null && curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg)"
install_windows = "winget install --id GitHub.cli -e --accept-package-agreements --accept-source-agreements"
required = false
notes = "PR open stage"

[[tools]]
id = "timeout"
profile = ["soft", "hard", "full"]
where = ["wsl"]
check = "command -v timeout || command -v gtimeout"
install_wsl = "sudo apt-get install -y coreutils"
required = false

# --- Foreman skill install ---
[[tools]]
id = "foreman_skill"
profile = ["soft", "hard", "full"]
where = ["windows", "wsl"]
check = "test -f \"$HOME/.claude/skills/foreman/SKILL.md\" || test -f \"$HOME/.agents/skills/foreman/SKILL.md\""
install_windows = "powershell -ExecutionPolicy Bypass -File install.ps1"
install_wsl = "bash install.sh"
required = true

[[tools]]
id = "markdownlint-cli2"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "markdownlint-cli2 --version"
install_wsl = "npm install -g markdownlint-cli2"
install_windows = "npm install -g markdownlint-cli2"
required = true
notes = "docs group -- markdown lint"

[[tools]]
id = "codespell"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "codespell --version || python3 -m codespell_lib --version || python -m codespell_lib --version"
install_wsl = "pip3 install --user codespell"
install_windows = "pip install --user codespell"
required = true
notes = "docs group -- spelling"

[[tools]]
id = "lychee"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "lychee --version"
install_windows = "winget install --id lycheeverse.lychee -e --accept-package-agreements --accept-source-agreements"
install_wsl = "cargo install lychee --locked || cargo binstall -y lychee"
required = true
notes = "docs group -- link check (offline by default)"

[[tools]]
id = "psscriptanalyzer"
profile = ["soft", "full"]
where = ["windows"]
check = 'powershell -NoProfile -Command "if (Get-Module -ListAvailable PSScriptAnalyzer) { exit 0 } else { exit 1 }"'
install_windows = 'powershell -NoProfile -Command "Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force"'
required = false
notes = "docs group -- PowerShell lint"

[[tools]]
id = "graphify"
profile = ["soft", "full"]
where = ["windows", "wsl"]
check = "python -c \"import graphify\" || python3 -c \"import graphify\""
install_hint = "pip install graphifyy  (module name: graphify)"
required = false
notes = "Knowledge-graph repo understanding; graph committed at graphify-out/graph.json"

[[tools]]
id = "openspec"
profile = ["full"]
where = ["windows", "wsl"]
check = "openspec --version"
install_wsl = "npm install -g @fission-ai/openspec"
install_windows = "npm install -g @fission-ai/openspec"
required = false
notes = "Optional CLI; foreman follows OpenSpec folder conventions without it"

[[tools]]
id = "bun"
profile = ["full"]
where = ["windows", "wsl"]
check = "bun --version"
install_windows = "winget install --id Oven-sh.Bun --version 1.3.14 -e"
required = false
notes = "Pinned to 1.3.14 -- winget does not self-pin (a later 'winget upgrade' can silently drift the installed version); tool-check WARNs (reports outdated, does not fail) when the installed bun is not exactly 1.3.14."

[[tools]]
id = "pueue"
profile = ["full"]
where = ["windows"]
check = "pueue --version"
install_windows = "# GitHub release binaries -- no package-manager route. Download pueue.exe + pueued.exe from https://github.com/Nukesor/pueue/releases into ~/.foreman/tools/pueue"
required = false
notes = "v4.0.4 staged at ~/.foreman/tools/pueue/{pueue.exe,pueued.exe}. No package-manager install route (GitHub release binaries only). Autostart doctrine: the pueue CLIENT never starts pueued itself (empirically confirmed -- `pueue status` with no daemon fails immediately rather than autostarting it); skills/foreman/scripts/lane-queue.sh's `ensure` subcommand spawns `pueued -d` itself when the daemon is unreachable -- see that script's header for the full empirical record."

[[tools]]
id = "coreutils"
profile = ["durable"]
where = ["windows", "wsl"]
check = "stdbuf --version || gstdbuf --version"
install_wsl = "sudo apt-get install -y coreutils"
install_windows = "scoop install main/coreutils"
required = true
notes = "stdbuf -oL line-buffers the reasoning stream tee"

[[tools]]
id = "nats-server"
profile = ["durable"]
where = ["windows", "wsl"]
check = "nats-server --version"
install_wsl = "curl -fsSL https://binaries.nats.dev/nats-io/nats-server/v2@latest | sh"
install_windows = "scoop install main/nats-server"
required = false
notes = "JetStream transport; required only when [durable] enabled with NATS"

[[tools]]
id = "nats-cli"
profile = ["durable"]
where = ["windows", "wsl"]
check = "nats --version"
install_wsl = "curl -sf https://binaries.nats.dev/nats-io/natscli/nats@latest | sh"
install_windows = "scoop install extras/natscli"
required = false
notes = "Drives JetStream from bash (setup, bridge, consume)"

[profiles.soft]
description = "Claude/Grok/Codex soft orchestration on host"
must = ["git", "python3", "grok", "codex", "foreman_skill"]
should = ["claude", "node", "npm", "jq"]

[profiles.hard]
description = "WSL2 bash harness + Docker workers"
must = ["git", "python3", "jq", "docker", "flock", "foreman_skill"]
should = ["shellcheck", "bats", "gh", "timeout", "grok", "codex"]

[profiles.full]
description = "Soft lanes + hard harness on Windows+WSL reference box"
must = ["git", "python3", "jq", "grok", "codex", "docker", "flock", "foreman_skill"]
should = ["claude", "node", "npm", "shellcheck", "bats", "gh", "timeout", "bun", "pueue"]

[profiles.durable]
must = ["git", "jq", "coreutils", "bash"]
should = ["nats-server", "nats-cli"]

[[skills]]
id = "foreman"
path = "skills/foreman"

[[skills]]
id = "scrapling"
path = "skills/scrapling"

[[skills]]
id = "graphify"
path = "skills/graphify"

[[skills]]
id = "superpowers"
path = "skills/superpowers"
