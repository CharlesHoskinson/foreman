name: gates-windows

# Native Windows is a focused release platform for v0.4.0. The complete Node
# and Bats suites remain gated on Linux/WSL; Windows gates static/runtime build
# integrity and the BW-004 lock/worktree slice.
#
# Why: the Bats suite has never passed on Windows. Its first and only full
# measurement (run 31199790530, 2026-08-07) scored pass=444 fail=270 skip=26,
# and a follow-up provisioning run was cancelled at the 60-minute job cap.
# 147 of those 270 failures were missing runner tooling rather than product
# defects, so the number measures the runner more than the code -- but the
# suite still does not fit the cap once provisioned, and nothing on Windows is
# proven.
#
# This workflow therefore runs on demand only. Its green result qualifies the
# named Windows slice; it does not claim that every Linux-specific filesystem
# test passes under native Windows semantics.
#
# Evidence: docs/evidence/w0/2026-08-07-windows-suite-measurement.md
# Re-enable by restoring the push/pull_request triggers once the suite passes
# there and fits the cap.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates-windows:
    name: gates-windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Windows Node static and runtime gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run verify-runtime
          npm run verify:appliance-lock
          npm run verify-register-doc
          npm run smoke:dst-0060
          node --import tsx --test scripts/run-tests.test.ts

      - name: Architecture policy against pull request base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          node skills/foreman/runtime/dist/architecture-policy.js check --base "${base}"

      - name: Run Council Node 24 gate
        working-directory: components/council
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile
          corepack pnpm check
          corepack pnpm exec openspec validate --all --strict --no-interactive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          winget.exe install --id koalaman.shellcheck --exact \
            --accept-package-agreements --accept-source-agreements \
            --disable-interactivity
          printf '%s\n' "${LOCALAPPDATA}\\Microsoft\\WinGet\\Links" >> "${GITHUB_PATH}"

          mkdir -p /usr/local/bin
          npm install --global --prefix "$(cygpath --windows /usr/local/bin)" \
            @fission-ai/openspec@1.10.0 \
            @informalsystems/quint@0.32.0 \
            bats@1.11.0

          # Quint otherwise queries the unauthenticated GitHub Releases API on
          # the first simulation. A rate-limit response makes every formal row
          # fail before evaluation. Pre-seed the exact evaluator asset from its
          # stable release URL and verify the publisher-recorded digest.
          evaluator_dir="${HOME}/.quint/rust-evaluator-v0.6.0"
          evaluator_stage="$(mktemp -d)"
          evaluator_zip="${evaluator_stage}/quint-evaluator-v0.6.0-windows.zip"
          curl --silent --show-error --location --fail --retry 3 \
            --output "${evaluator_zip}" \
            https://github.com/quint-co/quint/releases/download/evaluator/v0.6.0/quint_evaluator-x86_64-pc-windows-msvc.zip
          printf '%s  %s\n' \
            41275a43a74f2d601b9a4bf245960cea00fac669be61a8f9ca5f9059340988f7 \
            "${evaluator_zip}" | sha256sum --check --strict
          mkdir -p "${evaluator_dir}"
          unzip -q "${evaluator_zip}" -d "${evaluator_dir}"
          test -s "${evaluator_dir}/quint_evaluator.exe"

          printf '%s\n' '#!/usr/bin/env bash' 'exec python "$@"' \
            > /usr/local/bin/python3
          chmod +x /usr/local/bin/python3

          # flock (util-linux): the single largest cause of Windows failures
          # (134 of 270 in run 31199790530) -- tests/helpers.bash:162
          # setup_lock_trust_fixture requires a real `command -v flock`.
          # Git for Windows' own bash does NOT ship flock; that absence is
          # exactly what was measured, not assumed. windows-latest
          # pre-installs a full, working MSYS2 tree at C:\msys64 (pacman
          # present) but does not add it to PATH
          # (actions/runner-images Windows2022-Readme.md, MSYS2 section --
          # fetched directly rather than assumed). MSYS2's util-linux
          # package is a genuine flock(1) port, not a look-alike substitute,
          # so it is pulled from there.
          #
          # sqlite3 CLI: dependencies/README.md:104 calls this "Not required
          # -- convenience only" because the code uses the python3 stdlib
          # sqlite3 module. tests/session.bats:360 and :518 shell out to the
          # CLI anyway (3 of the 270 Windows failures). That contradiction
          # was left open in this repo's own W0 design doc and is not
          # resolved here either -- installing the CLI only removes the
          # symptom.
          #
          # Both binaries are run from their NATIVE C:\msys64\usr\bin
          # location, never copied elsewhere. Two things forced that:
          # (1) sqlite3.exe carries real extra runtime deps (libreadline,
          # tcl, zlib per packages.msys2.org) that pacman resolves alongside
          # it in that directory -- Windows finds a DLL in the launching
          # exe's own directory before PATH, so leaving it there needs no
          # extra harvesting. (2) An earlier attempt DID harvest flock.exe
          # plus a bare copy of msys-2.0.dll into /usr/local/bin. Printing
          # `flock --version` from that copy worked (run 31213637912), but
          # actually locking a file did not: `flock: cannot open lock file
          # /c/Users/runneradmin/.foreman/gate.lock: No such file or
          # directory`, even though tests/run.sh had already `mkdir -p`'d
          # that exact directory moments earlier via Git Bash's own mkdir.
          # The working theory is that the detached copy, isolated from its
          # real MSYS2 tree (no sibling /etc/fstab, no mount context), does
          # its own POSIX-path resolution differently than an in-place
          # instance would. Running both tools from their real location
          # removes that variable rather than chasing it further. Every
          # later step that needs either tool appends (never prepends)
          # /c/msys64/usr/bin to PATH -- see that step's own comment for why
          # prepend would be unsafe.
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm
          /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed util-linux sqlite python
          test -f /c/msys64/usr/bin/flock.exe
          test -f /c/msys64/usr/bin/sqlite3.exe
          test -f /c/msys64/usr/bin/python3.exe

          # BW-004 uses descriptor-mode flock. Bash and flock must therefore
          # share one MSYS runtime so descriptor numbers and POSIX paths name
          # the same objects in Bash, flock, and the lock-evidence parser.
          # Install the Bats launcher into MSYS2's own /usr/local tree; the
          # focused gate below runs under MSYS2 bash and uses MSYS2 Python.
          # Windows npm places global launchers directly in the prefix rather
          # than in a nested bin directory.
          msys_prefix="$(cygpath --windows /c/msys64/usr/local/bin)"
          npm install --global --prefix "${msys_prefix}" bats@1.11.0
          mkdir -p /c/msys64/usr/local/bin

          /c/msys64/usr/local/bin/bats --version
          /c/msys64/usr/bin/flock --version
          /c/msys64/usr/bin/python3 --version

          /usr/local/bin/openspec --version
          /usr/local/bin/quint --version
          /usr/local/bin/bats --version
          jq --version
          python3 --version
          node --version
          /c/msys64/usr/bin/flock.exe --version
          /c/msys64/usr/bin/sqlite3.exe --version

      # launcher/dist is gitignored (10 of 270 Windows failures trace to it
      # being absent -- never built on this runner). The repo has two build
      # scripts: launcher/build.ps1 (bun-windows-x64 target, outputs
      # dist/foreman-launch.exe) and `bun run build:posix` (bun-linux-x64,
      # used by gates-linux.yml for the WSL/Linux binary). build:posix does
      # not apply here; build.ps1 is the Windows path and is what
      # tests/launcher.bats:57 actually looks for.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build Windows launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -File launcher/build.ps1
          if (-not (Test-Path launcher/dist/foreman-launch.exe)) {
            throw "launcher/build.ps1 did not produce launcher/dist/foreman-launch.exe"
          }

      - name: BW-004 native Windows flock gate
        # Do not run this slice in Git-for-Windows Bash with MSYS2 flock.
        # Descriptor numbers are runtime-local and that mixed pairing fails
        # with `Bad file descriptor` even though command-mode flock succeeds.
        shell: 'C:\msys64\usr\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:$PATH"
          cd "$(cygpath --unix "$GITHUB_WORKSPACE")"
          command -v bats
          command -v flock
          command -v git
          command -v node
          mkdir -p -- "$HOME/.foreman"
          flock "$HOME/.foreman/bw-004.lock" -c "echo BW-004-LOCK-OK"

          # Prove the exact hermetic trust fixture can select and operate the
          # same-runtime flock before the larger Bats slice. This catches a
          # broken MSYS path/JSON boundary without producing a failure cascade.
          trust_tmp="$(mktemp -d)"
          BATS_TEST_TMPDIR="$trust_tmp"
          source tests/helpers.bash
          setup_lock_trust_fixture
          source skills/foreman/scripts/lib/lock.sh
          fm_lock_acquire "$trust_tmp/preflight.lock" 2
          test "$FM_LOCK_MECHANISM" = flock
          fm_lock_release "$trust_tmp/preflight.lock"
          rm -rf -- "$trust_tmp"

          bats tests/lock.bats tests/wt-new.bats tests/wt-merge.bats

      # ci-local.sh reports host-only gates as unavailable with their reason.
      # The install.ps1-only smoke remains owned by windows-smoke.yml.
      - name: Run the shared gate definition with Git Bash
        shell: bash
        env:
          # bats IS now provisioned here (npm bats@1.11.0, install step above),
          # but the gate stays OFF. Provisioning and passing are different
          # claims: the suite has never executed on Windows, so nobody knows
          # what it does there. Flipping this to "1" on the strength of the
          # binary existing would repeat b4ed7bd7, where the default flipped ON
          # against an unprovisioned runner and the workflow went red for seven
          # runs with rc=127.
          #
          # The non-gating probe step below is how that gets answered: it runs a
          # small slice with continue-on-error and publishes the result. This
          # flag flips only once that evidence exists, in its own commit.
          #
          # Stated explicitly rather than inherited: gates-linux opts IN with
          # "1", so this opts OUT with "0" and neither depends on the default.
          FOREMAN_CI_BATS: "0"
          TEST_SLICE_REPORT: ${{ runner.temp }}/foreman-test-slices.tsv
          TEST_TAP_LOG: ${{ runner.temp }}/foreman-test-tap.log
        run: |
          # Install step placed openspec/quint here and verified by absolute path;
          # without this on PATH the gates SKIP rather than run.
          #
          # /c/msys64/usr/bin (flock/sqlite3) is deliberately NOT added here.
          # A first attempt appended it to this step's PATH too and the
          # formal gate went from PASS to FAIL 19/19 matched=0 (run
          # 31213637912) -- something the formal suite shells out to that
          # was previously simply ABSENT on PATH started resolving to an
          # MSYS2 build instead, with different behavior. Appending (rather
          # than prepending) only protects names Git Bash ALREADY provides;
          # for a name Git Bash doesn't provide at all, appending still
          # changes NOT FOUND into FOUND (MSYS2 build), which is exactly the
          # regression. This step has FOREMAN_CI_BATS=0, so it never runs
          # bats and needs neither flock nor sqlite3 -- only the probe step
          # below does, so the PATH addition is scoped there alone.
          export PATH="/usr/local/bin:$PATH"
          bash tools/ci-local.sh

      # Evidence, not enforcement. The complete native Windows probe previously
      # consumed the full job timeout and delayed the enforcing BW-004 result.
      # Keep one small portable Bats smoke here; the complete suite remains on
      # Linux/WSL until it is separately qualified on native Windows.
      - name: Probe the bats suite on Windows (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          # /c/msys64/usr/bin appended, not prepended, and ONLY on this step
          # (never the gating step above -- see its PATH comment for why
          # that regressed the formal gate in run 31213637912). This is the
          # only step that actually runs bats, so it is the only one that
          # needs flock or sqlite3 resolvable by bare name.
          export PATH="/usr/local/bin:$PATH:/c/msys64/usr/bin"
          echo "bats: $(bats --version 2>&1 || echo UNAVAILABLE)"
          echo "timeout: $(command -v timeout || echo ABSENT)"
          echo "flock: $(command -v flock || echo ABSENT) -- $(flock --version 2>&1 || echo UNAVAILABLE)"
          echo "sqlite3: $(command -v sqlite3 || echo ABSENT) -- $(sqlite3 --version 2>&1 || echo UNAVAILABLE)"
          echo "launcher/dist: $(ls launcher/dist 2>&1 || echo ABSENT)"
          # tests/run.sh's acquire_bats_mutex() already does `mkdir -p --
          # "$HOME/.foreman"` right before `exec flock "$HOME/.foreman/gate.lock" ...`
          # (tests/run.sh:43-45), and run 31213637912 showed no mkdir error --
          # yet flock still reported the directory absent. Creating it here
          # too, before run.sh gets a chance to race it, is cheap insurance
          # per the coordinator's instruction; it does not touch run.sh
          # itself, which is test infrastructure out of this task's scope.
          mkdir -p -- "$HOME/.foreman"
          ls -la "$HOME/.foreman" 2>&1
          # Direct sanity check, isolated from run.sh's own exec chain: if
          # this still reports the directory absent, the earlier harvested-
          # copy theory was wrong and the cause is something flock.exe hits
          # regardless of where it runs from.
          /c/msys64/usr/bin/flock.exe "$HOME/.foreman/gate.lock" -c "echo LOCK_TEST_OK" 2>&1
          bats tests/manifest.bats
          echo "manifest probe rc=$?"

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-windows-reports-${{ github.run_id }}
          path: |
            formal/out/
            ${{ runner.temp }}/foreman-test-slices.tsv
            ${{ runner.temp }}/foreman-test-tap.log
          if-no-files-found: warn
