name: gates-linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates-linux:
    name: gates-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bats jq python3 shellcheck unzip util-linux
          npm install --global \
            @fission-ai/openspec@1.6.0 \
            @informalsystems/quint@0.32.0 \
            markdownlint-cli2@0.23.1
          python3 -m pip install --user --quiet codespell==2.4.1
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          lychee_tgz="$(mktemp)"
          curl --silent --show-error --location --fail \
            --output "$lychee_tgz" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a \
            "$lychee_tgz" | sha256sum --check --strict
          sudo tar --extract --gzip --file "$lychee_tgz" \
            --directory /usr/local/bin --strip-components=1 \
            lychee-x86_64-unknown-linux-gnu/lychee
          sudo ln --symbolic --force \
            "$(readlink --canonicalize "$(command -v openspec)")" \
            /usr/local/bin/openspec
          /usr/local/bin/openspec --version
          quint --version
          markdownlint-cli2 --version
          command -v codespell
          codespell --version
          lychee --version

      - name: Install NATS test dependencies
        shell: bash
        run: |
          set -euo pipefail
          nats_dir="$(mktemp -d)"
          server_archive="$nats_dir/nats-server.tar.gz"
          cli_archive="$nats_dir/nats-cli.zip"

          curl --silent --show-error --location --fail --retry 3 \
            --output "$server_archive" \
            https://github.com/nats-io/nats-server/releases/download/v2.14.4/nats-server-v2.14.4-linux-amd64.tar.gz
          curl --silent --show-error --location --fail --retry 3 \
            --output "$cli_archive" \
            https://github.com/nats-io/natscli/releases/download/v0.4.0/nats-0.4.0-linux-amd64.zip

          printf '%s  %s\n' \
            20f9d6a199560f243610908bcccea2e27e9f47213242d1c609ca46d1d73e91ea \
            "$server_archive" | sha256sum --check --strict
          printf '%s  %s\n' \
            8dbd437c826b953dbd7432cf890ef22ba3c33dccc3dce5e71b3e8d055427849c \
            "$cli_archive" | sha256sum --check --strict

          tar --extract --gzip --file "$server_archive" --directory "$nats_dir"
          unzip -q "$cli_archive" -d "$nats_dir"
          sudo install --mode=0755 \
            "$nats_dir/nats-server-v2.14.4-linux-amd64/nats-server" \
            /usr/local/bin/nats-server
          sudo install --mode=0755 \
            "$nats_dir/nats-0.4.0-linux-amd64/nats" \
            /usr/local/bin/nats

          test "$(nats-server --version)" = "nats-server: v2.14.4"
          test "$(nats --version)" = "0.4.0"

      # launcher/dist is gitignored; build the POSIX binary the bats suite expects.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build POSIX launcher
        shell: bash
        run: |
          set -euo pipefail
          cd launcher
          bun run build:posix
          test -x dist/foreman-launch
          ls -la dist/foreman-launch

      # Keep TEST_GATE_MODE unset: ci-local.sh defaults the bats gate to shadow.
      # Enforcing it is tag criterion 2 and requires three consecutive green runs.
      - name: Run the shared gate definition
        shell: bash
        env:
          FOREMAN_CI_BATS: "1"
          TEST_SLICE_REPORT: ${{ runner.temp }}/foreman-test-slices.tsv
          TEST_TAP_LOG: ${{ runner.temp }}/foreman-test-tap.log
        run: bash tools/ci-local.sh

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-linux-reports-${{ github.run_id }}
          path: |
            formal/out/
            ${{ runner.temp }}/foreman-test-slices.tsv
            ${{ runner.temp }}/foreman-test-tap.log
          if-no-files-found: warn
