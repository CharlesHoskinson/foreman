name: gates-linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates-linux:
    name: gates-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bats jq python3 shellcheck util-linux
          npm install --global \
            @fission-ai/openspec@1.6.0 \
            @informalsystems/quint@0.32.0
          sudo ln --symbolic --force \
            "$(readlink --canonicalize "$(command -v openspec)")" \
            /usr/local/bin/openspec
          /usr/local/bin/openspec --version
          quint --version

      # launcher/dist is gitignored; build the POSIX binary the bats suite expects.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build POSIX launcher
        shell: bash
        run: |
          set -euo pipefail
          cd launcher
          bun run build:posix
          test -x dist/foreman-launch
          ls -la dist/foreman-launch

      # Keep TEST_GATE_MODE unset: ci-local.sh defaults the bats gate to shadow.
      # Enforcing it is tag criterion 2 and requires three consecutive green runs.
      - name: Run the shared gate definition
        shell: bash
        env:
          FOREMAN_CI_BATS: "1"
          TEST_SLICE_REPORT: ${{ runner.temp }}/foreman-test-slices.tsv
          TEST_TAP_LOG: ${{ runner.temp }}/foreman-test-tap.log
        run: bash tools/ci-local.sh

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-linux-reports-${{ github.run_id }}
          path: |
            formal/out/
            ${{ runner.temp }}/foreman-test-slices.tsv
            ${{ runner.temp }}/foreman-test-tap.log
          if-no-files-found: warn
